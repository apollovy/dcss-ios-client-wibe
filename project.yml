name: DCSSiOSHost
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
packages:
  DCSSiOSClient:
    path: .
targets:
  DCSSiOSHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iOSAppHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apollov.dcssioshost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DCSS iOS Host
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        SWIFT_VERSION: 6.0
    dependencies:
      - package: DCSSiOSClient
        product: DCSSCore
schemes:
  DCSSiOSHost:
    build:
      targets:
        DCSSiOSHost: all
    run:
      config: Debug
    test:
      config: Debug
