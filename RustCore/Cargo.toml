[package]
name = "dcss_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
tokio = { version = "1.38.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.24.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3.30"
tungstenite = { version = "0.24.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
url = "2.5.1"
chrono = { version = "0.4.38", features = ["serde"] }
libc = "0.2.153"

