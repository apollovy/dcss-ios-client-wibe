[package]
name = "dcss_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
tokio = { version = "1.38.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.24.0"
futures-util = "0.3.30"
tungstenite = "0.24.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
url = "2.5.1"
chrono = { version = "0.4.38", features = ["serde"] }
libc = "0.2.153"

